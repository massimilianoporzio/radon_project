{% load static %}

<link rel="stylesheet" href="{% static 'leaflet/leaflet.css' %}" />
<div id="map-{{ codice_istat }}" style="height: 500px; width: 100%; border-radius: 8px; margin: 10px 0;"></div>

<script src="{% static 'leaflet/leaflet.js' %}"></script>
<script>
(function() {
    var mapId = 'map-{{ codice_istat }}';

    // Aspetta che il DOM sia pronto
    function initMap() {
        var mapElement = document.getElementById(mapId);
        if (!mapElement) {
            setTimeout(initMap, 100);
            return;
        }

        // Inizializza la mappa
        var map = L.map(mapId).setView([45.0, 7.6], 8);

        // Aggiungi tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Aggiungi la geometria del comune
        var geojsonFeature = {{ geojson|safe }};
        var layer = L.geoJSON(geojsonFeature, {
            style: {
                fillColor: '#3b82f6',
                weight: 2,
                opacity: 1,
                color: '#1e40af',
                fillOpacity: 0.3
            }
        }).addTo(map);

        // Auto-zoom sui confini
        if (layer.getBounds().isValid()) {
            map.fitBounds(layer.getBounds(), {
                padding: [50, 50],
                maxZoom: 11
            });
        }

        // Aggiungi popup
        layer.bindPopup(
            '<h3>{{ nome }}</h3>' +
            '<p><strong>Provincia:</strong> {{ provincia }}</p>' +
            '<p><strong>Codice ISTAT:</strong> {{ codice_istat }}</p>'
        );
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMap);
    } else {
        initMap();
    }
})();
</script>

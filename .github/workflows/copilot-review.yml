name: Auto Request Copilot Review

on:
  pull_request:
    types: [synchronize]  # Only trigger on new pushes to existing PRs, not on PR creation

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Copilot Review
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: number,
                reviewers: [],
                team_reviewers: []
              });
              console.log('Copilot review requested');
            } catch (error) {
              console.log('Could not request review:', error.message);
            }

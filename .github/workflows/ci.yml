name: Django CI (PostGIS Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Queste variabili valgono per tutti gli step
  DJANGO_SECRET_KEY: "chiave-finta-per-la-ci-non-usare-in-produzione"
  DJANGO_DEBUG: "False"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      # --- 1. INSTALLAZIONE LIBRERIE GIS DI SISTEMA ---
      # Queste sono necessarie perché il runner non le ha di default (GDAL, GEOS, PROJ)
      - name: Install System Dependencies (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev

      - name: Install Python Dependencies
        run: uv sync --all-extras --dev

      # --- 2. AUDIT DI SICUREZZA ---
      - name: Run Security Audit (pip-audit)
        run: uv run pip-audit

      - name: Run Ruff (Linting)
        run: uv run ruff check .

      - name: Run Ruff (Formatting Check)
        run: uv run ruff format --check .

      # --- 3. ESECUZIONE TEST CON SQLite ---
      - name: Run Tests with Coverage (SQLite)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
          # 1. Eseguiamo le migrazioni
          uv run python manage.py migrate --noinput

          # 2. Verifica che la vista ComuneCompleto sia stata creata (se su PostgreSQL)
          echo "🔍 Verifico models..."
          uv run python manage.py shell -c "
          from territorio.models import ComuneCompleto, ComuneArpa
          print('✅ Models importati correttamente')
          "

          # 3. Lanciamo i test con coverage
          uv run pytest --cov=territorio --cov=users --cov-report=term-missing --cov-report=html

      # --- 4. UPLOAD COVERAGE REPORT ---
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

name: Django CI (PostGIS Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DJANGO_SECRET_KEY: "chiave-finta-per-la-ci-non-usare-in-produzione"
  DJANGO_DEBUG: "False"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Servizio PostgreSQL con PostGIS
    services:
      postgres:
        image: postgis/postgis:14-3.3
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      # INSTALLAZIONE LIBRERIE GIS DI SISTEMA
      - name: Install System Dependencies (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev

      - name: Install Python Dependencies
        run: uv sync --all-extras --dev

      # AUDIT DI SICUREZZA
      - name: Run Security Audit (pip-audit)
        run: uv run pip-audit

      - name: Run Ruff (Linting)
        run: uv run ruff check .

      - name: Run Ruff (Formatting Check)
        run: uv run ruff format --check .

      # Abilita PostGIS nel database di test
      - name: Enable PostGIS Extension
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_test_db -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U ci_user -d ci_test_db -c "CREATE EXTENSION IF NOT EXISTS postgis_topology;"

      # ESECUZIONE TEST SU POSTGIS
      - name: Run Tests with Coverage (PostGIS)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_test_db
        run: |
          uv run python manage.py migrate --noinput

          # Verifica che la vista ComuneCompleto sia stata creata
          uv run python manage.py shell -c "
          from territorio.models import ComuneCompleto
          count = ComuneCompleto.objects.count()
          print(f'✅ Vista ComuneCompleto creata (records: {count})')
          "

          uv run pytest --cov=territorio --cov=users --cov-report=term-missing --cov-report=html

      # UPLOAD COVERAGE REPORT
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

name: Django CI (PostGIS Ready)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DJANGO_SECRET_KEY: "chiave-finta-per-la-ci-non-usare-in-produzione"
  DJANGO_DEBUG: "False"
  # Password generata per il database di test CI (non usata in produzione)
  CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'test_password_for_ci_only_12345' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Servizio PostgreSQL con PostGIS
    services:
      postgres:
        image: postgis/postgis:14-3.3
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'test_password_for_ci_only_12345' }}
          POSTGRES_DB: ci_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      # INSTALLAZIONE LIBRERIE GIS DI SISTEMA
      - name: Install System Dependencies (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev libgeos-dev

      - name: Install Python Dependencies
        run: uv sync --all-extras --dev

      # AUDIT DI SICUREZZA
      - name: Run Security Audit (pip-audit)
        run: uv run pip-audit

      - name: Run Ruff (Linting)
        run: uv run ruff check .

      - name: Run Ruff (Formatting Check)
        run: uv run ruff format --check .

      # Wait for PostgreSQL to be ready
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ci_user; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      # Note: PostGIS extensions are automatically enabled by conftest.py
      # when the test database is created by pytest

      # ESECUZIONE TEST SU POSTGIS
      - name: Run Tests with Coverage (PostGIS)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DATABASE_URL: postgresql://ci_user:${{ secrets.CI_DB_PASSWORD || 'test_password_for_ci_only_12345' }}@localhost:5432/ci_test_db
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "from apps.territorio.models import ComuneCompleto; print(f'✅ Vista ComuneCompleto creata (records: {ComuneCompleto.objects.count()})')"
          uv run pytest apps/ --cov=apps --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75

      # UPLOAD COVERAGE REPORT
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      # UPLOAD COVERAGE TO CODECOV
      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mdformat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check Markdown formatting
        run: uv run mdformat --check --exclude .venv .

# Codecov configuration for radon_project

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 90%
        threshold: 1%
        base: auto
        informational: false
    patch:
      default:
        target: 85%
        threshold: 2%
        base: auto
        informational: false

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "*/migrations/*"
  - "*/tests/*"
  - "conftest.py"
  - "manage.py"
  - "*/asgi.py"
  - "*/wsgi.py"
  - "htmlcov/*"
  - "scripts/*"
  - "data/*"

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py

# Coverage settings - pragmatico, non perfezionista
addopts =
    --cov=apps
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-fail-under=75
    --cov-branch

# Ometti dalla coverage le parti non critiche
[coverage:run]
omit =
    */migrations/*
    */management/*
    */tests/*
    */settings/*

[coverage:report]
# Ometti anche dal report
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    class.*\(.*Model\):.*abstract = True
